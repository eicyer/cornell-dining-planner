<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Admin — Cornell Dining Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;0,700;1,500&family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style nonce="{{ nonce }}">
  :root {
    --paper: #F7F3EA;
    --ink: #1C1A17;
    --ink-secondary: #6B6355;
    --hairline: #E4DCC8;
    --accent: #B31B1B;
    --accent-ink: #FFFFFF;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Archivo', sans-serif;
  }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card {
    max-width: 420px;
    padding: 48px 32px;
    text-align: center;
  }
  .kicker {
    font-family: 'Archivo', sans-serif;
    font-weight: 600;
    font-size: 12px;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    color: var(--ink-secondary);
    margin-bottom: 16px;
  }
  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: 32px;
    line-height: 1.2;
    margin: 0 0 12px;
  }
  p {
    font-size: 15px;
    line-height: 1.5;
    color: var(--ink-secondary);
    margin: 0 0 32px;
  }
  a.button {
    display: inline-block;
    background: var(--accent);
    color: var(--accent-ink);
    font-family: 'Archivo', sans-serif;
    font-weight: 600;
    font-size: 15px;
    text-decoration: none;
    padding: 14px 28px;
    border-radius: 0;
  }
  a.button:hover { opacity: 0.85; }
</style>
</head>
<body>
  <div class="card">
    <div class="kicker">Cornell Dining · Admin</div>
    <h1>Food Database</h1>
    <p>Sign in with the admin Google account to review and correct nutrition data.</p>
    <a class="button" href="/auth/login?next=/admin">Sign in with Google →</a>
  </div>
</body>
</html>
