<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Admin — Cornell Dining Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;0,700;1,500&family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style nonce="{{ nonce }}">
  :root {
    --paper: #F7F3EA;
    --ink: #1C1A17;
    --ink-secondary: #6B6355;
    --hairline: #E4DCC8;
    --accent: #B31B1B;
    --accent-ink: #FFFFFF;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Archivo', sans-serif;
  }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card {
    max-width: 440px;
    padding: 48px 32px;
    text-align: center;
  }
  .kicker {
    font-family: 'Archivo', sans-serif;
    font-weight: 600;
    font-size: 12px;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 16px;
  }
  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: 28px;
    line-height: 1.2;
    margin: 0 0 12px;
  }
  p { font-size: 15px; line-height: 1.5; color: var(--ink-secondary); margin: 0 0 8px; }
  .email {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 14px;
    color: var(--ink);
    border-bottom: 1px solid var(--hairline);
    display: inline-block;
    padding-bottom: 2px;
    margin: 8px 0 32px;
  }
  button {
    background: none;
    border: none;
    border-bottom: 1px solid var(--ink);
    color: var(--ink);
    font-family: 'Archivo', sans-serif;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    padding: 0 0 2px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="kicker">Not authorized</div>
    <h1>This account can't access the admin panel.</h1>
    <p>You're signed in as</p>
    <div class="email">{{ email }}</div>
    <p><button id="logoutBtn">Log out and switch accounts</button></p>
  </div>
<script nonce="{{ nonce }}">
document.getElementById('logoutBtn').addEventListener('click', () => {
  fetch('/auth/logout', { method: 'POST', credentials: 'include' }).then(() => { location.href = '/admin'; });
});
</script>
</body>
</html>
